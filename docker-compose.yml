# Local MongoDB for development: a single-node replica set, because the server uses transactions.
#   docker compose up -d mongo
#   MONGODB_URI=mongodb://localhost:27017/finvision?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Initializes the replica set on first start; afterwards it only reports the status.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
